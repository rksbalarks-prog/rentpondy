<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Favicon configurations -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/rentpondylogo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/rentpondylogo.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/rentpondylogo.png" />
    
    <!-- Viewport and theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4F4B7E" />
    
    <!-- SEO and description.
         These are the FALLBACK tags only. Every route overrides them at runtime
         through <Seo> (src/seo/Seo.jsx), and crawler-facing property / landing
         pages are server-rendered by the backend (PPC/Seo/). -->
    <meta name="description" content="Find houses, apartments, commercial spaces and land for rent in Pondicherry and Chennai. Owner-posted listings with real photos and rent - zero brokerage. New properties added daily." />
    <meta name="author" content="RentPondy" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="https://rentpondy.com/" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rent Pondy" />
    
    <!-- Open Graph / Twitter for social sharing -->
    <meta property="og:site_name" content="Rent Pondy" />
    <meta property="og:title" content="Rent Pondy | Rental Houses &amp; Commercial Property in Pondicherry" />
    <meta property="og:description" content="Owner-posted houses, apartments, commercial spaces and land for rent in Pondicherry and Chennai. Zero brokerage." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rentpondy.com/" />
    <meta property="og:image" content="%PUBLIC_URL%/rentpondylogo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rent Pondy | Rental Houses &amp; Commercial Property in Pondicherry" />
    <meta name="twitter:image" content="%PUBLIC_URL%/rentpondylogo.png" />
    
    <!-- Google Maps API -->
    <script async
      defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB0wL8bW7T1bHM0YXMQgJbd1XKk-YIxaDU&libraries=places"></script>
    
    <script src="https://unpkg.com/@googlemaps/markerclustererplus/dist/index.min.js"></script>
    <script>
      // Cross-domain storage handler
      window.addEventListener('storage', function(event) {
        if (event.key === 'ppc_phone') {
          // Copy the value from process domain to main domain
          localStorage.setItem('ppc_phone', event.newValue);
          
          // Optional: Redirect to pondicherry after receiving the phone
          if (window.location.pathname !== '/pondicherry') {
            window.location.href = '/pondicherry';
          }
        }
      });
    </script>

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Rent Pondy | Rental Houses &amp; Commercial Property in Pondicherry</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
