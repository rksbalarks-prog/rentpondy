<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyGradient)"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#FFD700"/>
  
  <!-- Simple house -->
  <rect x="100" y="150" width="200" height="120" fill="#D2691E"/>
  <polygon points="100,150 200,80 300,150" fill="#8B4513"/>
  
  <!-- Door -->
  <rect x="180" y="200" width="40" height="70" fill="#654321"/>
  <circle cx="215" cy="235" r="3" fill="#FFD700"/>
  
  <!-- Windows -->
  <rect x="120" y="170" width="35" height="35" fill="#87CEEB"/>
  <rect x="245" y="170" width="35" height="35" fill="#87CEEB"/>
</svg>