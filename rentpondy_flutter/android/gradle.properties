# Keep the Gradle JVM modest so the NDK native compiler (clang/ninja for the
# transitive `jni` module via path_provider_android) has enough system memory —
# an 8G heap here caused "ninja: fatal: paging file is too small".
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation: its cache (.tab files) fails to close
# on Windows when the project path contains spaces ("Rent Pondy user and admin"),
# causing ":shared_preferences_android:compileDebugKotlin" to fail. Turning it
# off compiles cleanly at a small rebuild-speed cost.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
