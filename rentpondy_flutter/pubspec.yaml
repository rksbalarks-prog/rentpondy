name: rent_pondy_user
description: "Rent Pondy — Flutter port of the Rent Pondy user app."
publish_to: 'none'
version: 1.0.0+42

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Local persistence (localStorage equivalent for phoneNumber / city base)
  shared_preferences: ^2.3.2

  # Images
  cached_network_image: ^3.4.1

  # Fonts (Inter — matches the web app's "Inter, sans-serif")
  google_fonts: ^6.2.1

  # Formatting (en-IN currency + dates)
  intl: ^0.19.0

  # Carousels / banners
  carousel_slider: ^5.0.0

  # Launch tel:/wa.me/https links
  url_launcher: ^6.3.1

  # PayU hosted checkout — the web app auto-submits a POST form to
  # secure.payu.in/_payment, so we replay that inside a WebView.
  # webview_flutter has no web implementation, so the Chrome/web build posts the
  # form from the page itself instead — see lib/screens/payu_web_submit_web.dart.
  webview_flutter: ^4.10.0
  web: ^1.1.1

  # Property photo upload (multipart to /update-rent-property)
  image_picker: ^1.1.2

  # AI assistant voice: microphone capture (STT upload to /transcribe) and mp3
  # playback of the /speak reply. Both use the platform's built-in codecs
  # (MediaRecorder / ExoPlayer on Android) — no NDK/native compile step.
  # record 7.x: the 5.x set shipped a stale record_linux (0.7.2) that fails to
  # implement the streaming interface, breaking the Android build; 7.x's endorsed
  # impls are mutually consistent.
  record: ^7.0.0
  audioplayers: ^6.1.0
  # Temp dir for the recorded voice clip, and MIME type for the /transcribe upload.
  path_provider: ^2.1.4
  http_parser: ^4.0.2

  # Firebase Cloud Messaging (push notifications). Inert until an
  # android/app/google-services.json is added + the google-services Gradle
  # plugin is applied — see README "Push notifications".
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Shows FCM data messages as a banner while the app is in the foreground.
  flutter_local_notifications: ^18.0.1
  clarity_flutter: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Dev-only generators: replace the default Flutter launcher icon + splash
  # screen with the Rent Pondy logo. They generate native files once and ship
  # nothing into the app.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Launcher icon (home screen + the Android 12+ system splash icon).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/rentpondylogo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/rentpondylogo.png"

# Launch/splash screen shown while Flutter boots.
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/rentpondylogo.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#FFFFFF"
    image: "assets/images/rentpondylogo.png"

# path_provider_android 2.3.x switched to JNI bindings, which forces a full
# NDK/CMake native compile (clang + ninja) during every Android build. On this
# machine that step exhausts memory ("paging file is too small"). Pinning to the
# last pure-Kotlin 2.2.x release removes the native build entirely; it is pulled
# in only transitively (cached_network_image -> flutter_cache_manager).
dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
